spring:
  application:
    name: order-service
  cloud:
    config:
      enabled: true
    discovery:
      enabled: true
    gateway:
      enabled: true
  config:
    import: optional:configserver:http://localhost:9999
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:order-db
    username: order-service

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: "*"